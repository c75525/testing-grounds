<html lang="en">
<head>
  <meta charset="UTF-8" />

<body>
  <main class="files-page is-folder-overview">
    <h1 id="files-title" class="visually-hidden">Files</h1>
    <div class="files-layout">
    <section class="directory-panel" aria-labelledby="files-title">
      <p class="visually-hidden" id="directory-help">Up and Down highlight entries. Enter opens a folder or previews an item. Enter again opens the previewed link. Escape closes the preview, then the folder.</p>
      <div id="directory" aria-describedby="directory-help"></div>
    </section>
    <figure class="file-preview" hidden>
      <a class="preview-link" target="_blank" rel="noopener noreferrer"><img class="preview-image" alt="" /></a>
      <figcaption class="preview-caption"></figcaption>
    </figure>
    </div>
    <span class="preview-connector" aria-hidden="true"></span>
    <p class="visually-hidden" id="file-status" role="status"></p>
  </main>
