<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Stroke Dotter</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <header class="masthead">
      <h1>Stroke Dotter</h1>
      <p>Import an SVG and animate dots along its strokes.</p>
    </header>

    <section class="controls" aria-label="Stroke dot animation controls">
      <div class="button-row">
        <button type="button" id="import-button">Import SVG</button>
        <input id="svg-file" type="file" accept="image/svg+xml,.svg" hidden>
        <button type="button" id="direction-button" aria-pressed="false">Direction: forward</button>
        <button type="button" id="play-button" aria-pressed="false">Pause</button>
        <button type="button" id="reset-button">Reset</button>
      </div>

      <div class="slider-grid">
        <label class="slider-control" for="dash-length">
          <span>Dash length</span>
          <output id="dash-value" for="dash-length">16 px</output>
          <input id="dash-length" type="range" min="1" max="64" value="16" step="1">
        </label>
        <label class="slider-control" for="gap-length">
          <span>Gap length</span>
          <output id="gap-value" for="gap-length">10 px</output>
          <input id="gap-length" type="range" min="0" max="96" value="10" step="1">
        </label>
        <label class="slider-control" for="speed">
          <span>Speed</span>
          <output id="speed-value" for="speed">48 px/s</output>
          <input id="speed" type="range" min="0" max="360" value="48" step="1">
        </label>
      </div>
    </section>

    <section class="export-controls" aria-label="Video export settings">
      <p class="export-spec">MP4 export · 1927 × 1158 px · 60 fps · 2 seconds · 30px horizontal / 20px vertical padding</p>
      <div class="color-grid">
        <label class="color-control" for="background-color">
          <span>Background color</span>
          <span class="color-input">
            <input id="background-color" type="text" value="#fffbcf" inputmode="text" maxlength="7" pattern="#[0-9A-Fa-f]{6}" spellcheck="false" aria-describedby="background-help">
            <span id="background-swatch" class="color-swatch" aria-hidden="true"></span>
          </span>
          <small id="background-help">#RRGGBB</small>
        </label>
        <label class="color-control" for="stroke-color">
          <span>Stroke color</span>
          <span class="color-input">
            <input id="stroke-color" type="text" value="#111111" inputmode="text" maxlength="7" pattern="#[0-9A-Fa-f]{6}" spellcheck="false" aria-describedby="stroke-help">
            <span id="stroke-swatch" class="color-swatch" aria-hidden="true"></span>
          </span>
          <small id="stroke-help">#RRGGBB</small>
        </label>
      </div>
      <div class="button-row export-actions">
        <button type="button" id="export-button">Export MP4</button>
      </div>
      <p id="export-status" class="export-status" aria-live="polite">Export uses the current SVG and settings.</p>
    </section>

    <p id="file-status" class="file-status" aria-live="polite">Previewing the included SVG.</p>

    <section class="preview" aria-label="Animated SVG preview">
      <svg id="preview-svg" viewBox="0 0 960 540" role="img" aria-label="Dotted stroke animation preview">
        <path d="M156 334C156 185 284 99 442 126c142 24 232 129 183 234-41 87-173 112-273 76-99-35-150-128-72-197 83-74 250-67 356 7 96 67 114 181 30 249-97 80-282 75-397 4" />
        <path d="M694 169c44 41 73 102 73 169 0 123-100 223-223 223-55 0-106-20-145-53" />
      </svg>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
